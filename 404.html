<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PLERA · Page Not Found</title>
  <style>
    :root{--bg:#090b0d;--panel:#111419;--line:#3a3f47;--text:#f4efe5;--muted:#b9b4aa;--gold:#d5b978}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#090b0d,#0d1014);color:var(--text);font-family:"Brandon Grotesque","Avenir Next","Helvetica Neue",Arial,sans-serif;padding:24px}
    main{width:min(100%,666px);text-align:center;border:1px solid var(--line);background:var(--panel);padding:44px 28px;border-radius:12px}
    .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.18em;font-size:.76rem}
    h1{font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:.06em;font-size:clamp(2rem,7vw,4rem);margin:14px 0}
    p{color:var(--muted);line-height:1.65}
    .actions{display:flex;justify-content:center;gap:11px;flex-wrap:wrap;margin-top:28px}
    a{display:inline-flex;align-items:center;justify-content:center;min-width:170px;padding:11px 16px;border:1px solid var(--gold);color:var(--text);text-decoration:none;text-transform:uppercase;letter-spacing:.09em;font-size:.74rem;border-radius:3px}
    a.secondary{border-color:var(--line);color:var(--muted)}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">PLERA · Static Public Edge</div>
    <h1>Not Found</h1>
    <p>The requested public page is not present. PLERA does not redirect missing paths into private STOS services and does not expose operational endpoints as a fallback.</p>
    <div class="actions">
      <a href="./">PLERA Home</a>
      <a class="secondary" href="continuity.html">Continuity Guidance</a>
    </div>
  </main>
</body>
</html>
